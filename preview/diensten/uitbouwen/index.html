<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uitbouwen — MD-ontwerpen — preview</title>
    <!-- Work in progress, published only so it can be looked at on a real URL.
         Kept out of the index deliberately: the live site at / is the one that
         should rank, and this page would otherwise compete with it. Do not add
         a Disallow for this path in robots.txt - crawlers have to be able to
         fetch the page to see this tag. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Self-hosted and declared in styles.css. Preloaded because it is
         discovered only once the stylesheet has parsed, which otherwise costs
         a round trip. Only latin is preloaded; latin-ext is fetched on demand
         by unicode-range. -->
    <link rel="preload" href="../../assets/fonts/roboto-700-latin.woff2"
          as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../../assets/fonts/roboto-400-latin.woff2"
          as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../../assets/css/styles.css?v=fefd5727" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-logo" href="../../" aria-label="MD-ontwerpen, naar de homepage"></a>

      <!-- Contextual: shows the level this page belongs to. Inline from 1024px
           up; below that the menu button carries the navigation instead. -->
      <nav class="site-nav" aria-label="Paginamenu">
        <ul>
          <li><a href="../"><span>Kozijnwijzigingen</span></a></li>
          <li><a href="./" aria-current="page"><span>Uitbouwen</span></a></li>
          <li><a href="../dakopbouwen/"><span>Dakopbouwen</span></a></li>
          <li><a href="../muurdoorbraken/"><span>Muurdoorbraken</span></a></li>
          <li><a href="../transformaties/"><span>Transformaties</span></a></li>
        </ul>
      </nav>

      <!-- Always NL then EN, whichever language you are reading. Ordering them
           current-first made the pair swap places on every language change. -->
      <ul class="lang-switch">
        <li><a href="./" hreflang="nl" aria-current="true">NL</a></li>
        <li><a href="../../en/services/extensions/" hreflang="en">EN</a></li>
      </ul>

      <!-- Available at every width: it opens the whole navigation, which the
           contextual header nav deliberately does not show. -->
      <button class="nav-toggle" type="button" aria-expanded="false"
              aria-controls="hoofdmenu" aria-label="Menu openen"
              data-label-open="Menu openen" data-label-close="Menu sluiten">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
      </button>

      <nav class="site-menu" id="hoofdmenu" data-open="false" aria-label="Hoofdmenu">
        <ul>
          <li><a href="../../"><span>Home</span></a></li>
          <li><a href="../"><span>Diensten</span></a></li>
            <li class="site-menu-sub"><a href="./" aria-current="page"><span>Uitbouwen</span></a></li>
            <li class="site-menu-sub"><a href="../dakopbouwen/"><span>Dakopbouwen</span></a></li>
            <li class="site-menu-sub"><a href="../muurdoorbraken/"><span>Muurdoorbraken</span></a></li>
            <li class="site-menu-sub"><a href="../transformaties/"><span>Transformaties</span></a></li>
          <li><a href="../../over/"><span>Over</span></a></li>
          <li><a href="../../referenties/"><span>Referenties</span></a></li>
          <li><a href="../../contact/"><span>Contact</span></a></li>
        </ul>
      </nav>
    </header>

    <main class="site-main">
      <!-- Carries on behind the header and footer bands. The modifier decides
           whether it fills the viewport or is shown whole on white. -->
      <img class="backdrop backdrop--cover" src="../../assets/img/diensten.jpg" alt="" />
    </main>

    <footer class="site-footer">
      <span class="site-footer-copy">&copy; 2026 MD-ontwerpen. Alle rechten voorbehouden.</span>
      <a class="site-footer-up" href="../"><span>Een niveau omhoog</span></a>
    </footer>

    <script src="../../assets/js/nav.js?v=687455f7" defer></script>
  </body>
</html>
