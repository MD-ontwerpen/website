<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MD-ontwerpen — preview</title>

    <!-- Work in progress, published only so it can be looked at on a real URL.
         Kept out of the index deliberately: the live site at / is the one that
         should rank, and this page would otherwise compete with it. Do not add
         a Disallow for this path in robots.txt - crawlers have to be able to
         fetch the page to see this tag. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <span class="site-logo" role="img" aria-label="MD-ontwerpen"></span>

      <button
        class="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="hoofdmenu"
        aria-label="Menu openen"
      >
        <span class="nav-toggle-bars" aria-hidden="true"></span>
      </button>

      <!-- Inside <header> so it shares the header's stacking context and stays
           above the backdrop. hrefs are placeholders until the URL structure
           is settled. -->
      <nav class="site-nav" id="hoofdmenu" hidden>
        <ul>
          <li><a href="#">Kozijnwijzigingen</a></li>
          <li><a href="#">Uitbouwen</a></li>
          <li><a href="#">Dakopbouwen</a></li>
          <li><a href="#">Muurdoorbraken</a></li>
          <li><a href="#">Transformaties</a></li>
        </ul>
      </nav>
    </header>

    <main class="site-main">
      <!-- Fills the whole viewport and carries on behind the header and footer
           bands. Swap the src, keep the class. -->
      <img class="backdrop" src="assets/img/achtergrond.jpg" alt="" />
    </main>

    <footer class="site-footer">
      <span>&copy; 2026 MD-ontwerpen</span>
    </footer>

    <script src="assets/js/nav.js" defer></script>
  </body>
</html>
