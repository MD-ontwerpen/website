<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MD-ontwerpen — preview</title>
    <!-- Work in progress, published only so it can be looked at on a real URL.
         Kept out of the index deliberately: the live site at / is the one that
         should rank, and this page would otherwise compete with it. Do not add
         a Disallow for this path in robots.txt - crawlers have to be able to
         fetch the page to see this tag. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- The font is self-hosted and declared in styles.css. Preloaded because
         it is discovered only once the stylesheet has parsed, which otherwise
         delays it by a whole round trip. Only the latin subset is preloaded -
         latin-ext is fetched on demand by unicode-range. -->
    <link
      rel="preload"
      href="../assets/fonts/roboto-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="../assets/fonts/roboto-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <!-- Pinned black rather than currentColor: the mark is a fixed brand
           asset and should not follow the surrounding ink. -->
      <a class="site-logo" href="./" aria-label="MD-ontwerpen, to the homepage"></a>

      <!-- Contextual: this is the top level. Inline from 900px up, hidden below it,
           where the menu button carries the navigation instead. -->
      <nav class="site-nav" aria-label="Page menu">
        <ul>
          <li><a href="services/">Services</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">References</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>

      <ul class="lang-switch">
          <li><a href="../" hreflang="nl">NL</a></li>
          <li><a href="./" hreflang="en" aria-current="true">EN</a></li>
      </ul>

      <!-- Available at every width, not just the narrow one: it opens the whole
           navigation, which the contextual header nav deliberately does not
           show. -->
      <button
        class="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="hoofdmenu"
        aria-label="Open menu"
        data-label-open="Open menu"
        data-label-close="Close menu"
      >
        <span class="nav-toggle-bars" aria-hidden="true"></span>
      </button>

      <nav class="site-menu" id="hoofdmenu" data-open="false" aria-label="Main menu">
        <ul>
          <li><a href="./">Home</a></li>
          <li><a href="./services/">Services</a></li>
            <li class="site-menu-sub"><a href="#">Window alterations</a></li>
            <li class="site-menu-sub"><a href="#">Extensions</a></li>
            <li class="site-menu-sub"><a href="#">Roof extensions</a></li>
            <li class="site-menu-sub"><a href="#">Structural openings</a></li>
            <li class="site-menu-sub"><a href="#">Conversions</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">References</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="site-main">
      <!-- Fills the whole viewport and carries on behind the header and footer
           bands. Swap the src, keep the class. -->
      <img class="backdrop" src="../assets/img/achtergrond.jpg" alt="" />
    </main>

    <footer class="site-footer">
      <span class="site-footer-copy">&copy; 2026 MD-ontwerpen. All rights reserved.</span>
    </footer>

    <script src="../assets/js/nav.js" defer></script>
  </body>
</html>
